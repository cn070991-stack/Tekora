<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RatherApp - Contáctanos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="container nav-container">
            <a href="index.html" class="logo">Tekora <span>TK</span></a>
            <nav>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="servicios.html">Servicios</a></li>
                    <li><a href="nosotros.html">Nosotros</a></li>
                    <li><a href="contacto.html" class="active">Contáctanos</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container page-content">
        <a href="index.html" class="btn-back-home">← Volver al Menú Principal / Inicio</a>

        <div class="page-header">
            <h2>Formulario de Contacto</h2>
            <p style="color: var(--text-muted)">Cuéntanos sobre tu proyecto y te responderemos a la brevedad.</p>
        </div>

        <div class="contact-container">
            <form onsubmit="alert('¡Mensaje enviado con éxito!'); return false;">
                <div class="form-group">
                    <label for="name">Nombre o Nombre de la Empresa</label>
                    <input type="text" id="name" placeholder="Escribe tu nombre" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="correo@ejemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="service">Servicio Requerido</label>
                    <input type="text" id="service" placeholder="Ej: Desarrollo Web, Software, App Móvil">
                </div>

                <div class="form-group">
                    <label for="message">Mensaje / Detalles del Proyecto</label>
                    <textarea id="message" rows="5" placeholder="Escribe aquí los detalles..." required></textarea>
                </div>

                <button type="submit" class="btn-gold" style="width: 100%;">ENVIAR MENSAJE</button>
            </form>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 RatherApp. Todos los derechos reservados.</p>
        </div>
    </footer>

</body>
</html>
